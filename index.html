<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maps by Joey</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app-shell">

  <header class="site-header">
    <div class="header-row">
      <button class="wordmark-btn hand" id="wordmark-btn"></button>
      <nav class="desktop-nav" id="desktop-nav"></nav>
      <button class="mobile-nav-btn" id="mobile-menu-open-btn" aria-label="Open menu">
        <img src="assets/icons/hamburger.png" alt="">
      </button>
    </div>
    <div class="mobile-menu" id="mobile-menu">
      <button class="close-btn" id="mobile-menu-close-btn" aria-label="Close menu">
        <img src="assets/icons/close.png" alt="">
      </button>
      <div id="mobile-menu-items"></div>
    </div>
  </header>

  <div id="screen-root"></div>

</div>

<!-- Lightbox (shared by the Journal screen) -->
<div class="lightbox hidden" id="lightbox">
  <button class="lightbox-close" id="lightbox-close-btn" aria-label="Close">&times;</button>
  <div class="lightbox-inner">
    <img id="lightbox-img" src="" alt="">
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>
</div>

<script src="js/content.js"></script>
<script src="js/main.js"></script>
</body>
</html>
